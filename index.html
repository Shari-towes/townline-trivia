<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Townline Golf Trivia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #2E7D32; color: white; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #FFD700; margin: 20px 0; }
        button { 
            background: #FFD700; color: #2E7D32; border: none; padding: 15px 30px; 
            margin: 10px; border-radius: 5px; font-size: 1.1rem; cursor: pointer;
            font-weight: bold;
        }
        .screen { display: none; }
        .active { display: block; }
        .room-code { font-size: 3rem; font-weight: bold; color: #FFD700; margin: 20px 0; }
        .question { font-size: 1.3rem; margin: 20px 0; color: #FFD700; }
        .option { 
            background: white; color: #2E7D32; padding: 15px; margin: 10px; 
            border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        input { padding: 10px; margin: 10px; border-radius: 5px; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏌️‍♂️ Townline Golf Trivia</h1>
        
        <!-- Main Menu -->
        <div id="menu" class="screen active">
            <button onclick="showScreen('create')">Create Game</button>
            <button onclick="showScreen('join')">Join Game</button>
        </div>
        
        <!-- Create Game -->
        <div id="create" class="screen">
            <h2>Create Game Room</h2>
            <button onclick="createGame()">Generate Room Code</button>
            <div class="room-code" id="roomCode">----</div>
            <p>Share this code with players</p>
            <button onclick="startGame()" id="startBtn" style="display:none">Start Game</button>
            <button onclick="showScreen('menu')">Back</button>
        </div>
        
        <!-- Join Game -->
        <div id="join" class="screen">
            <h2>Join Game</h2>
            <input type="text" id="playerName" placeholder="Your name">
            <input type="text" id="gameCode" placeholder="Room code" maxlength="4" style="text-transform:uppercase">
            <button onclick="joinGame()">Join</button>
            <div id="joinStatus"></div>
            <button onclick="showScreen('menu')">Back</button>
        </div>
        
        <!-- Game Screen -->
        <div id="game" class="screen">
            <div class="question" id="question">Question will appear here</div>
            <div id="options"></div>
            <div id="score">Score: <span id="scoreValue">0</span></div>
            <button onclick="endGame()">End Game</button>
        </div>
    </div>

    <script>
        // Simple questions
        const questions = [
            {
                question: "How many holes on a standard golf course?",
                options: ["9", "18", "27", "36"],
                answer: 1
            },
            {
                question: "Which club is for longest shots?",
                options: ["Putter", "Wedge", "Driver", "Iron"],
                answer: 2
            },
            {
                question: "What is one under par called?",
                options: ["Eagle", "Birdie", "Bogey", "Par"],
                answer: 1
            }
        ];

        // Simple screen management
        function showScreen(screenName) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenName).classList.add('active');
        }

        // Create game
        function createGame() {
            const code = Math.random().toString(36).substr(2, 4).toUpperCase();
            document.getElementById('roomCode').textContent = code;
            document.getElementById('startBtn').style.display = 'block';
        }

        // Join game
        function joinGame() {
            const name = document.getElementById('playerName').value;
            const code = document.getElementById('gameCode').value;
            
            if (!name) {
                document.getElementById('joinStatus').textContent = 'Enter your name';
                return;
            }
            
            if (code.length !== 4) {
                document.getElementById('joinStatus').textContent = 'Enter 4-letter code';
                return;
            }
            
            document.getElementById('joinStatus').textContent = 'Joined game!';
            showScreen('game');
            showQuestion(0);
        }

        // Start game
        function startGame() {
            showScreen('game');
            showQuestion(0);
        }

        // Show question
        function showQuestion(index) {
            if (index >= questions.length) {
                endGame();
                return;
            }
            
            const q = questions[index];
            document.getElementById('question').textContent = q.question;
            
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            q.options.forEach((option, i) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = option;
                div.onclick = function() {
                    checkAnswer(i, q.answer);
                };
                optionsDiv.appendChild(div);
            });
        }

        // Check answer
        function checkAnswer(selected, correct) {
            const options = document.querySelectorAll('.option');
            options.forEach(opt => opt.style.pointerEvents = 'none');
            
            if (selected === correct) {
                options[selected].style.background = '#4CAF50';
                const score = parseInt(document.getElementById('scoreValue').textContent) + 10;
                document.getElementById('scoreValue').textContent = score;
            } else {
                options[selected].style.background = '#f44336';
                options[correct].style.background = '#4CAF50';
            }
            
            setTimeout(() => {
                const currentIndex = questions.indexOf(
                    questions.find(q => q.question === document.getElementById('question').textContent)
                );
                showQuestion(currentIndex + 1);
            }, 2000);
        }

        // End game
        function endGame() {
            showScreen('menu');
        }

        // Make sure it works on mobile
        document.addEventListener('touchstart', function() {});
    </script>
</body>
</html>
